name: Build Android APK

on:
  workflow_dispatch:
  # The workflow is introduced on beta first. This narrow push trigger lets
  # GitHub register and validate it before the Android code reaches main.
  push:
    branches: [beta]
    paths:
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          tools_zip="$RUNNER_TEMP/android-command-line-tools.zip"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$tools_zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $tools_zip" | sha256sum -c -
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          unzip -q "$tools_zip" -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          sdkmanager_path="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_path" --licenses > /dev/null
          "$sdkmanager_path" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: windows
        run: npm ci

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk f50-monitor-android-debug.apk
          sha256sum f50-monitor-android-debug.apk > f50-monitor-android-debug.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging f50-monitor-android-debug.apk | head -n 3

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: F50-Monitor-Android-Debug
          path: |
            f50-monitor-android-debug.apk
            f50-monitor-android-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
