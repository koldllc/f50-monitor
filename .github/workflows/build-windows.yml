name: Build Windows Release

on:
  push:
    branches: [main, master]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'windows/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'windows/src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        working-directory: ./windows
        run: npm install

      - name: Build Tauri Windows App (${{ matrix.arch }})
        working-directory: ./windows
        run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}

      - name: Upload Windows Artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: F50-Monitor-Windows-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            windows/src-tauri/target/${{ matrix.target }}/release/f50-monitor.exe

      - name: Release App (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/src-tauri/target/${{ matrix.target }}/release/f50-monitor.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

