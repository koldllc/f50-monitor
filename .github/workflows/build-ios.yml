name: Build iOS Release

on:
  push:
    branches: [main, master]
    paths:
      - 'iOS/**'
      - 'Sources/F50Core/**'
      - '.github/workflows/build-ios.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: '是否上传至最新 GitHub Release'
        required: false
        type: boolean
        default: true

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          for xcode in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcodebuild -version

      - name: Build Unsigned iOS App
        run: |
          xcodebuild \
            -project iOS/F50Monitor-iOS.xcodeproj \
            -scheme F50Monitor-iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/F50Monitor-iOS.app Payload/
          zip -r -q f50-monitor-ios-unsigned.ipa Payload
          cp f50-monitor-ios-unsigned.ipa f50-monitor-ios.ipa
          rm -rf Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: F50-Monitor-iOS
          if-no-files-found: ignore
          path: |
            f50-monitor-ios-unsigned.ipa
            f50-monitor-ios.ipa

      - name: Release App (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            f50-monitor-ios-unsigned.ipa
            f50-monitor-ios.ipa
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Latest Release (Manual Trigger)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_release == true }}
        run: |
          LATEST_TAG=$(gh release view --json tagName -q .tagName)
          echo "Target Release Tag: $LATEST_TAG"
          gh release upload "$LATEST_TAG" f50-monitor-ios-unsigned.ipa f50-monitor-ios.ipa --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
