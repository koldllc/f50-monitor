[package]
name = "f50-monitor"
version = "1.6.3"
description = "ZTE F50 5G MiFi Status Monitor for Windows"
authors = ["koldllc"]
edition = "2021"

[lib]
name = "f50_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-opener = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
regex = "1.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
